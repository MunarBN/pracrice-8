<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Finder</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <h1>Movie Finder</h1>
    <div class="search">
      <input id="title" type="text" placeholder="Movie title, e.g. Inception" aria-label="Movie title">
      <button id="searchBtn">Search Movie</button>
    </div>
    <p id="status" role="status"></p>
    <section id="result" hidden>
      <h2 id="titleYear"></h2>
      <p>Rating: <strong id="rating"></strong></p>
      <p id="plot"></p>
      <button id="watchBtn">Add to Watchlist</button>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
